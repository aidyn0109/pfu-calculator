<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Калькулятор ПФУ{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tom Select -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.7/dist/cdn.min.js"></script>

    <style>
        :root {
            --brand: {{ brand_color }};
            --brand-dark: #0048bf;
            --brand-soft: #eaf1ff;
            --ink: #15181f;
            --muted: #6b7280;
            --line: #e6e8ee;
            --bg: #f5f7fb;
            --card: #ffffff;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Topbar */
        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            position: sticky; top: 0; z-index: 50;
        }
        .topbar-inner {
            max-width: 1040px; margin: 0 auto; padding: 0 24px;
            height: 62px; display: flex; align-items: center; gap: 28px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.2px; }
        .brand .logo {
            width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
            color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 800;
        }
        .brand small { color: var(--muted); font-weight: 500; font-size: 13px; }
        nav { display: flex; gap: 6px; margin-left: auto; align-items: center; }
        nav a {
            text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px;
            padding: 8px 14px; border-radius: 9px;
        }
        nav a:hover { background: var(--bg); color: var(--ink); }
        nav a.active { background: var(--brand-soft); color: var(--brand); }
        .userbox { display: flex; align-items: center; gap: 10px; margin-left: 8px; padding-left: 14px; border-left: 1px solid var(--line); }
        .userbox .uname { font-size: 13.5px; font-weight: 600; }
        .userbox .urole { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--brand); background: var(--brand-soft); padding: 2px 8px; border-radius: 999px; }
        .userbox a.logout { color: var(--muted); font-size: 13px; }

        .container { max-width: 1040px; margin: 0 auto; padding: 32px 24px 72px; }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; margin: 0 0 4px; }
        h2 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; margin: 0 0 14px; }
        .subtitle { color: var(--muted); margin: 0 0 26px; }

        /* Form controls */
        label { display: block; font-weight: 600; font-size: 13.5px; margin: 0 0 7px; color: #374151; }
        .hint { color: var(--muted); font-size: 12.5px; font-weight: 400; }
        input[type="number"], input[type="text"], input[type="password"] {
            width: 100%; padding: 11px 13px; font-size: 15px; color: var(--ink);
            border: 1px solid var(--line); border-radius: 10px; font-family: inherit;
            background: #fff; transition: border-color .15s, box-shadow .15s;
        }
        input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .ts-control { border-radius: 10px !important; border-color: var(--line) !important; padding: 6px 8px !important; }
        .ts-control.focus { box-shadow: 0 0 0 3px var(--brand-soft) !important; border-color: var(--brand) !important; }

        /* Buttons */
        .btn {
            background: var(--brand); color: #fff; border: none;
            padding: 12px 20px; border-radius: 10px; font-size: 14.5px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: filter .15s, transform .05s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { filter: brightness(.95); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .btn.secondary { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
        .btn.secondary:hover { background: var(--brand-soft); filter: none; }
        .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
        .btn.ghost:hover { background: var(--bg); color: var(--ink); filter: none; }
        .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }

        /* Cards */
        .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
        .card + .card { margin-top: 18px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

        /* Выбор годов расчёта */
        .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .chip-year {
            font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
            padding: 9px 18px; border-radius: 999px; user-select: none;
            border: 1px solid var(--line); background: #fff; color: #374151;
            transition: background .15s, border-color .15s, color .15s;
        }
        .chip-year:hover { border-color: var(--brand); color: var(--brand); }
        .chip-year.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

        /* Блок пользовательских параметров формул (вкладка MDE) */
        .param-group { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: #fcfcfd; }
        .param-group + .param-group { margin-top: 14px; }
        .param-group h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 700; letter-spacing: -.1px; }
        .param-group .formula {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px; color: var(--muted); margin-bottom: 12px; word-break: break-word;
        }
        .param-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 860px) { .param-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .param-grid { grid-template-columns: 1fr; } }
        .param-grid label { font-size: 12.5px; margin-bottom: 5px; }
        .params-used { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .params-used .tag {
            font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
            background: var(--brand-soft); color: var(--brand); border: 1px solid #cfe0ff;
        }

        /* Alerts */
        .warn { background: #fff8e1; border: 1px solid #ffd54f; color: #7a5b00; border-radius: 10px; padding: 9px 13px; font-size: 13.5px; }
        .warn + .warn { margin-top: 8px; }
        .error { background: #fdecec; border: 1px solid #f3a3a3; color: #a31515; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
        .success { background: #e9f7ef; border: 1px solid #8fd6ad; color: #14663b; border-radius: 10px; padding: 10px 14px; font-size: 14px; }

        /* Result metrics */
        .result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .badge-bin { color: var(--muted); font-size: 13px; font-weight: 500; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 6px; }
        @media (max-width: 640px) { .metrics { grid-template-columns: 1fr; } }
        .metric { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fcfcfd; }
        .metric .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
        .metric .val { font-size: 22px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.5px; }
        .metric .ind { font-size: 13px; color: #374151; }
        .pill { display: inline-block; margin-top: 8px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #fff1f0; color: #c0392b; border: 1px solid #f5c6c2; }
        .pfu-box {
            margin-top: 16px; padding: 18px 20px; border-radius: 12px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); color: #fff;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
        }
        .pfu-box .lab { font-size: 13px; opacity: .85; font-weight: 500; }
        .pfu-box .num { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
        .pfu-box .raw { font-size: 12.5px; opacity: .85; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
        th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .3px; }
        tbody tr:hover { background: #fafbfe; }

        .muted { color: var(--muted); font-size: 13px; }
        .empty { text-align: center; color: var(--muted); padding: 30px; border: 1px dashed var(--line); border-radius: 12px; }
        .row-actions { display: flex; gap: 8px; }
        .stack { display: flex; flex-direction: column; gap: 6px; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .spacer { flex: 1; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="logo">BI</span>
                <span>BI Group <small>· Калькулятор ПФУ</small></span>
            </div>
            {% if user %}
            <nav>
                <a href="/" class="{% block nav_calc %}{% endblock %}">Калькулятор</a>
                <a href="/mde" class="{% block nav_mde %}{% endblock %}">Калькулятор MDE</a>
                {% if user.role == 'admin' %}
                <a href="/admin" class="{% block nav_admin %}{% endblock %}">Администрирование</a>
                {% endif %}
                <span class="userbox">
                    <span class="uname">{{ user.username }}</span>
                    <span class="urole">{{ 'Админ' if user.role == 'admin' else 'Пользователь' }}</span>
                    <a class="logout" href="/logout">Выйти</a>
                </span>
            </nav>
            {% endif %}
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
