services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./pfu.db:/app/pfu.db
      - ./data/import:/app/data/import
      - ./exports:/app/exports
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
